<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pyKnit · Even Shaping</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
  <link rel="stylesheet" href="../_assets/common.css" />
</head>
<body>
  <header class="demo-header">
    <div class="eyebrow">pyKnit · PyScript demo</div>
    <h1>Even Shaping</h1>
    <p>Space increases or decreases evenly across a round or a row.</p>
    <div class="linkbar">
      <a href="../index.html">← all demos</a>
    </div>
  </header>

  <div id="status-banner" class="status-banner loading">
    <div class="status-icon"></div>
    <div class="status-text">
      <p id="status-message">Loading pyknit...</p>
      <p id="status-detail" class="detail"></p>
    </div>
  </div>

  <py-config>
    packages = ["pydantic", "pillow", "pyknit"]
    terminal = false
  </py-config>

  <section class="card">
    <h2>Shaping</h2>
    <div class="grid-2">
      <div class="form-group">
        <label for="operation">Operation</label>
        <select id="operation">
          <option value="increase" selected>Increase</option>
          <option value="decrease">Decrease</option>
        </select>
      </div>
      <div class="form-group">
        <label for="in_the_round">Knit in the round</label>
        <select id="in_the_round">
          <option value="true" selected>Yes (round)</option>
          <option value="false">No (flat)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="starting_count">Starting stitches</label>
        <input id="starting_count" type="number" value="20" min="2" step="1" />
      </div>
      <div class="form-group">
        <label for="number">Number of increases / decreases</label>
        <input id="number" type="number" value="5" min="1" step="1" />
      </div>
    </div>
    <button id="run" class="btn-primary">Compute Shaping</button>
    <div id="demo-error" class="error-message" style="display: none;"></div>
    <div id="demo-output"></div>
  </section>

  <footer>
    <p>Powered by <code>pyknit.increase_evenly</code> and <code>pyknit.decrease_evenly</code>.</p>
  </footer>

  <script type="py" src="../_assets/shared.py"></script>
  <script type="py" src="../_demos/shaping.py"></script>
  <script type="py">
    set_status("ready", "✔ pyknit loaded", "ready to compute")
    bind_click("run", wire_demo(DEMO))
  </script>
</body>
</html>
