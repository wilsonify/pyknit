name: Lint (black)

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: psf/black@87928e6d6761a4a6d22250e1fee5601b3998086e  # 26.5.1
        with:
          options: "--check --color"
