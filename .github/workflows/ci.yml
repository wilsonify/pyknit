name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Stage 0: calculate unique SemVer version ──────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
      - id: calc
        run: python scripts/calculate_version.py

  # ── Stage 1: linters (all parallel) ─────────────────────────────────
  lint-black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: psf/black@87928e6d6761a4a6d22250e1fee5601b3998086e  # 26.5.1
        with:
          options: "--check --color"

  lint-flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --only-binary :all: flake8==7.1.1
          flake8 pyknit/ scripts/ test/

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: .github/workflows/scripts/lint-js.sh

  lint-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: .github/workflows/scripts/lint-html.sh

  lint-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: .github/workflows/scripts/lint-css.sh

  lint-gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: 17
      - run: .github/workflows/scripts/lint-gradle.sh

  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: .github/workflows/scripts/lint-yaml.sh

  # ── Stage 2: unit tests against source ───────────────────────────────
  unit-tests:
    needs: [version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: .github/workflows/scripts/install-test-deps.sh

      - name: Run unit tests
        run: .github/workflows/scripts/run-unit-tests.sh

      - name: Run doctests
        run: .github/workflows/scripts/run-doctests.sh

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: unit-results-${{ matrix.python-version }}
          path: unit-results.xml

  # ── Stage 3: SonarCloud quality gate ────────────────────────────────
  sonarcloud:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: .github/workflows/scripts/install-test-deps.sh

      - name: Run tests with coverage
        run: .github/workflows/scripts/run-tests-coverage.sh

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e  # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=wilsonify_pyknit
            -Dsonar.organization=wilsonify
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=pyknit/
            -Dsonar.tests=test/
            -Dsonar.exclusions=**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.svg,**/*.woff,**/*.woff2,**/*.ttf,**/*.eot

  # ── Stage 4: clean Python package build ──────────────────────────────
  python-build:
    needs: [version, sonarcloud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Clean build
        run: .github/workflows/scripts/build-python-wheel.sh

      - name: Verify package
        run: .github/workflows/scripts/verify-python-package.sh

      - name: Upload Python wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: python-wheel
          path: dist/*.whl
          retention-days: 5

  # ── Stage 5: integration tests against built package ─────────────────
  integration-tests:
    needs: [python-build, sonarcloud]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Download built wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: python-wheel
          path: dist/

      - name: Install from wheel (not source)
        run: .github/workflows/scripts/install-wheel-for-testing.sh

      - name: Run integration tests
        run: .github/workflows/scripts/run-integration-tests.sh
        env:
          PYQ_BASE: http://127.0.0.1:8000

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: integration-results
          path: integration-results.xml

  # ── Stage 6: clean PyScript build ────────────────────────────────────
  pyscript-build:
    needs: [integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary :all: -r requirements.txt

      - name: Clean build
        run: .github/workflows/scripts/build-pyscript-clean.sh

      - name: Cache PyScript runtime
        run: make runtime-cache

      - name: Assemble PyScript distribution
        run: .github/workflows/scripts/assemble-pyscript-dist.sh

      - name: Upload PyScript distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pyscript-dist
          path: dist/pyscript/
          retention-days: 5

  # ── Stage 7: PyScript E2E tests against generated build ──────────────
  pyscript-e2e:
    needs: [pyscript-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"

      - name: Download PyScript distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: pyscript-dist
          path: site/

      - name: Install test dependencies
        run: .github/workflows/scripts/install-pyscript-test-deps.sh

      - name: Start server and run E2E tests
        run: .github/workflows/scripts/run-pyscript-e2e.sh

      - name: Upload PyScript E2E results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pyscript-e2e-results
          path: pyscript-e2e-results.xml

  # ── Stage 8: clean Android build ─────────────────────────────────────
  android-build:
    needs: [pyscript-e2e, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3

      - name: Determine version
        id: ver
        run: |
          .github/workflows/scripts/android-determine-version.sh "${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Write local.properties
        run: .github/workflows/scripts/android-write-local-properties.sh

      - name: Build APK
        run: .github/workflows/scripts/android-build-apk.sh "${{ steps.ver.outputs.version_name }}" "${{ steps.ver.outputs.version_code }}"

      - name: Upload Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5

  # ── Stage 9: Android E2E tests ───────────────────────────────────────
  android-e2e:
    needs: [android-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: android-apk
          path: apk/

      - name: Verify APK
        run: .github/workflows/scripts/android-verify-apk.sh apk/app-debug.apk

  # ── CVE vulnerability scan (after successful build) ──────────────────
  cve-scan:
    needs: [python-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SYFT_VERSION: "1.51.1"
      GRYPE_VERSION: "0.118.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Cache Syft binary
        id: cache-syft
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /usr/local/bin/syft
          key: syft-linux-amd64-${{ env.SYFT_VERSION }}

      - name: Install Syft
        if: steps.cache-syft.outputs.cache-hit != 'true'
        run: .github/workflows/scripts/install-syft.sh "${{ env.SYFT_VERSION }}"

      - name: Verify Syft
        run: syft --version

      - name: Cache Grype binary
        id: cache-grype
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /usr/local/bin/grype
          key: grype-linux-amd64-${{ env.GRYPE_VERSION }}

      - name: Install Grype
        if: steps.cache-grype.outputs.cache-hit != 'true'
        run: .github/workflows/scripts/install-grype.sh "${{ env.GRYPE_VERSION }}"

      - name: Verify Grype
        run: grype version

      - name: Generate SBOM
        run: .github/workflows/scripts/generate-sbom.sh

      - name: Scan for vulnerabilities
        run: .github/workflows/scripts/scan-vulnerabilities.sh

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d  # v3
        with:
          sarif_file: grype-results.sarif
          category: grype-scan-ci
