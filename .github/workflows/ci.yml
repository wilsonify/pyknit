name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── Stage 0: calculate unique SemVer version ──────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
      - id: calc
        run: python scripts/calculate_version.py

  # ── Stage 1: linters (all parallel, no dependencies) ────────────────
  lint-black:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: psf/black@87928e6d6761a4a6d22250e1fee5601b3998086e  # 26.5.1
        with:
          options: "--check --color"

  lint-flake8:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --only-binary :all: flake8==7.1.1
          flake8 pyknit/ scripts/ test/

  lint-js:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: .github/workflows/scripts/lint-js.sh

  lint-html:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: .github/workflows/scripts/lint-html.sh

  lint-css:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: .github/workflows/scripts/lint-css.sh

  lint-gradle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: 17
      - run: .github/workflows/scripts/lint-gradle.sh

  lint-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - run: .github/workflows/scripts/lint-yaml.sh

  # ── Stage 2: unit tests against source (parallel with linters) ──────
  unit-tests:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: .github/workflows/scripts/install-test-deps.sh

      - name: Run unit tests
        run: .github/workflows/scripts/run-unit-tests.sh

      - name: Run doctests
        run: .github/workflows/scripts/run-doctests.sh

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: unit-results-${{ matrix.python-version }}
          path: unit-results.xml

  # ── Stage 3: SonarCloud quality gate (parallel with unit-tests) ────
  sonarcloud:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: .github/workflows/scripts/install-test-deps.sh

      - name: Run tests with coverage
        run: .github/workflows/scripts/run-tests-coverage.sh

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=wilsonify_pyknit
            -Dsonar.organization=wilsonify
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=pyknit/
            -Dsonar.tests=test/
            -Dsonar.exclusions=**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.svg,**/*.woff,**/*.woff2,**/*.ttf,**/*.eot

  # ── Stage 4: clean Python package build (parallel with tests) ───────
  python-build:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Clean build
        run: .github/workflows/scripts/build-python-wheel.sh

      - name: Verify package
        run: .github/workflows/scripts/verify-python-package.sh

      - name: Upload Python wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: python-wheel
          path: dist/*.whl
          retention-days: 5

  # ── Stage 5: integration tests (per-demo matrix, parallel) ──────────
  integration-tests:
    needs: [python-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        demo:
          - gauge-conversion
          - chart-renderer
          - even-shaping
          - hat-crown
          - pi-shawl
          - pattern-io
          - raglan-sweater
          - shawl-shapes
          - sleeve-decreases
          - sock-calculator
          - yarn-estimator
          - knit-simulator
          - needle-advisor
          - yarn-advisor
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Download built wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: python-wheel
          path: dist/

      - name: Install from wheel (not source)
        run: .github/workflows/scripts/install-wheel-for-testing.sh

      - name: Download PyScript runtime assets
        run: .github/workflows/scripts/download-pyscript-runtime.sh

      - name: Start demo server
        run: |
          python -m http.server 8000 --directory demos &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/ > /dev/null 2>&1 && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8000/ > /dev/null || { echo "Server failed to start"; exit 1; }

      - name: Test ${{ matrix.demo }}
        run: PYQ_WORKERS=1 PYQ_DEMO=${{ matrix.demo }} python test/integration/qa_all_demos.py
        env:
          PYQ_BASE: http://127.0.0.1:8000

  # ── Stage 5b: index.html link check ─────────────────────────────────
  integration-index:
    needs: [python-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Download built wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: python-wheel
          path: dist/

      - name: Install from wheel (not source)
        run: .github/workflows/scripts/install-wheel-for-testing.sh

      - name: Download PyScript runtime assets
        run: .github/workflows/scripts/download-pyscript-runtime.sh

      - name: Start demo server
        run: |
          python -m http.server 8000 --directory demos &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/ > /dev/null 2>&1 && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8000/ > /dev/null || { echo "Server failed to start"; exit 1; }

      - name: Check index.html links
        env:
          PYQ_BASE: http://127.0.0.1:8000
        run: |
          python -c "
          import sys; sys.path.insert(0, 'test/integration')
          import qa_demos
          from playwright.sync_api import sync_playwright
          p = sync_playwright().start()
          b = p.chromium.launch(headless=True)
          problems = qa_demos.check_index(b)
          b.close(); p.stop()
          if problems:
              for p_ in problems: print('FAIL:', p_)
              sys.exit(1)
          print('All demo links resolve')
          "

  # ── Stage 6: clean PyScript build ────────────────────────────────────
  pyscript-build:
    needs: [python-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary :all: -r requirements.txt

      - name: Clean build
        run: .github/workflows/scripts/build-pyscript-clean.sh

      - name: Cache PyScript runtime
        run: make runtime-cache

      - name: Assemble PyScript distribution
        run: .github/workflows/scripts/assemble-pyscript-dist.sh

      - name: Upload PyScript distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pyscript-dist
          path: dist/pyscript/
          retention-days: 5

  # ── Stage 7: PyScript E2E tests against generated build ──────────────
  pyscript-e2e:
    needs: [pyscript-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Download PyScript distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: pyscript-dist
          path: site/

      - name: Install test dependencies
        run: .github/workflows/scripts/install-pyscript-test-deps.sh

      - name: Start server and run E2E tests
        run: .github/workflows/scripts/run-pyscript-e2e.sh

      - name: Upload PyScript E2E results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pyscript-e2e-results
          path: pyscript-e2e-results.xml

  # ── Stage 8: clean Android build ─────────────────────────────────────
  android-build:
    needs: [python-build, version]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: 17

      # Chaquopy needs a build Python matching the app's version (3.11) on
      # PATH; ubuntu-latest only provides 3.12 by default. Install it so the
      # Gradle build can find python3.11.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v4

      - name: Determine version
        id: ver
        run: |
          .github/workflows/scripts/android-determine-version.sh "${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Write local.properties
        run: .github/workflows/scripts/android-write-local-properties.sh

      - name: Build APK
        run: .github/workflows/scripts/android-build-apk.sh "${{ steps.ver.outputs.version_name }}" "${{ steps.ver.outputs.version_code }}"

      - name: Upload Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5

  # ── Stage 9: Android E2E tests ───────────────────────────────────────
  android-e2e:
    needs: [android-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Download APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: android-apk
          path: apk/

      - name: Verify APK
        run: .github/workflows/scripts/android-verify-apk.sh apk/app-debug.apk

  # ── CVE vulnerability scan (after all builds pass) ───────────────────
  cve-scan:
    needs: [android-e2e, pyscript-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      SYFT_VERSION: "1.51.1"
      GRYPE_VERSION: "0.118.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Cache Syft binary
        id: cache-syft
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /usr/local/bin/syft
          key: syft-linux-amd64-${{ env.SYFT_VERSION }}

      - name: Install Syft
        if: steps.cache-syft.outputs.cache-hit != 'true'
        run: .github/workflows/scripts/install-syft.sh "${{ env.SYFT_VERSION }}"

      - name: Verify Syft
        run: syft --version

      - name: Cache Grype binary
        id: cache-grype
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /usr/local/bin/grype
          key: grype-linux-amd64-${{ env.GRYPE_VERSION }}

      - name: Install Grype
        if: steps.cache-grype.outputs.cache-hit != 'true'
        run: .github/workflows/scripts/install-grype.sh "${{ env.GRYPE_VERSION }}"

      - name: Verify Grype
        run: grype version

      - name: Download Python wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: python-wheel
          path: artifacts/python/

      - name: Download Android APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: android-apk
          path: artifacts/android/

      - name: Download PyScript dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: pyscript-dist
          path: artifacts/pyscript/

      - name: Generate SBOMs (parallel)
        run: |
          mkdir -p sboms
          syft dir:. --select-catalogers python --exclude "./.venv/**" --exclude "./android/app/build/**" --exclude "./sarif/**" -o spdx-json=sboms/source.spdx.json &
          syft artifacts/python/*.whl -o spdx-json=sboms/wheel.spdx.json &
          syft artifacts/android/app-debug.apk -o spdx-json=sboms/android.spdx.json &
          syft dir:artifacts/pyscript/ -o spdx-json=sboms/pyscript.spdx.json &
          wait
          echo "All SBOMs generated"
          ls -lh sboms/

      - name: Scan for vulnerabilities
        id: scan
        run: bash .github/workflows/scripts/scan-vulns.sh

      - name: Sanitize SARIF for CodeQL upload
        id: sanitize
        run: bash .github/workflows/scripts/sanitize-sarif.sh

      - name: Validate SARIF before upload
        id: validate
        run: bash .github/workflows/scripts/validate-sarif.sh

      - name: Upload SARIF (source)
        if: steps.sanitize.outcome == 'success' && steps.validate.outcome == 'success'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          sarif_file: sarif/source.sarif
          category: grype-source

      - name: Upload SARIF (Python wheel)
        if: steps.sanitize.outcome == 'success' && steps.validate.outcome == 'success'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          sarif_file: sarif/wheel.sarif
          category: grype-wheel

      - name: Upload SARIF (Android APK)
        if: steps.sanitize.outcome == 'success' && steps.validate.outcome == 'success'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          sarif_file: sarif/android.sarif
          category: grype-android

      - name: Upload SARIF (PyScript dist)
        if: steps.sanitize.outcome == 'success' && steps.validate.outcome == 'success'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4
        with:
          sarif_file: sarif/pyscript.sarif
          category: grype-pyscript

      - name: Fail on high/critical findings
        if: always()
        run: bash .github/workflows/scripts/fail-on-high.sh
