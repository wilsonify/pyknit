[project]
name = "pyknit"
version = "0.1.4"
authors = [
  { name="Terri Oda", email="terri@toybox.ca" },
]
description = "A set of math and charting tools for knitters."
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.9"
dependencies = [
  "pydantic>=1.0",
  "Pillow>=7.0",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: OS Independent",
]

[project.scripts]
my-script = "pyknit.pyknit:main"

[project.urls]
"Homepage" = "https://github.com/terriko/pyknit"
"Bug Tracker" = "https://github.com/terriko/pyknit/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyknit*"]
exclude = ["build*", "test*", "documentation*", "demos*", "openspec*"]

[tool.setuptools.package-data]
"pyknit" = ["symbols/*.png", "symbols/japanese/*.png"]

[tool.pytest.ini_options]
testpaths = ["test/unit"]
python_files = ["test_*.py", "qa_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]