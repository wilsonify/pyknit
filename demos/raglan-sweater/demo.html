<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pyKnit · Raglan Sweater</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
  <link rel="stylesheet" href="../_assets/common.css" />
</head>
<body>
  <header class="demo-header">
    <div class="eyebrow">pyKnit · PyScript demo</div>
    <h1>Raglan Sweater</h1>
    <p>Calculate the marker setup for a top-down raglan sweater.</p>
    <div class="linkbar">
      <a href="../index.html">← all demos</a>
    </div>
  </header>

  <div id="status-banner" class="status-banner loading">
    <div class="status-icon"></div>
    <div class="status-text">
      <p id="status-message">Loading pyknit...</p>
      <p id="status-detail" class="detail"></p>
    </div>
  </div>

  <py-config>
    packages = ["pydantic", "pillow", "../_wheel/pyknit-0.1.0-py3-none-any.whl"]
    terminal = false
  </py-config>

  <section class="card">
    <h2>Raglan</h2>
    <div class="grid-2">
      <div class="form-group">
        <label for="neck_stitches">Neck stitches</label>
        <input id="neck_stitches" type="number" value="80" min="1" step="1" />
      </div>
      <div class="form-group">
        <label for="arm_stitches">Arm stitches</label>
        <input id="arm_stitches" type="number" value="30" min="1" step="1" />
      </div>
      <div class="form-group">
        <label for="bust_stitches">Bust stitches</label>
        <input id="bust_stitches" type="number" value="100" min="1" step="1" />
      </div>
      <div class="form-group">
        <label for="neck_to_bust_rows">Neck to bust rows</label>
        <input id="neck_to_bust_rows" type="number" value="8" min="1" step="1" />
      </div>
      <div class="form-group">
        <label for="increase_per_increase_row">Increases per increase row</label>
        <input id="increase_per_increase_row" type="number" value="8" min="1" step="1" />
      </div>
      <div class="form-group">
        <label for="armpit_stitches">Armpit stitches</label>
        <input id="armpit_stitches" type="number" value="4" min="0" step="1" />
      </div>
    </div>
    <button id="run" class="btn-primary">Calculate Raglan</button>
    <div id="demo-error" class="error-message" style="display: none;"></div>
    <div id="demo-output"></div>
  </section>

  <footer>
    <p>Powered by <code>pyknit.raglan_increases</code>.</p>
  </footer>

<script type="py">
    from pyknit.pyscript._assets import shared
    from pyknit.pyscript._demos import raglan as DEMO
    shared.set_status("ready", "✔ pyknit loaded", "ready to calculate")
    shared.bind_click("run", shared.wire_demo(DEMO))
</script>
</body>
</html>
