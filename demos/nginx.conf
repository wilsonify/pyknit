server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        text/html                      html;
        text/css                       css;
        text/javascript                mjs js;
        text/plain                     txt py;
        application/wasm               wasm;
        application/json               json;
        application/octet-stream       whl zip;
        image/png                      png;
        image/svg+xml                  svg;
        image/x-icon                   ico;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml application/octet-stream;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.html$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(wasm|whl|mjs|js|css|zip)$ {
        expires 7d;
    }

    location / {
        try_files $uri =404;
    }
}