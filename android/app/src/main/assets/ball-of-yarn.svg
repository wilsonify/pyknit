<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <!-- Base ball gradient for modern depth -->
    <radialGradient id="yarn-base" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </radialGradient>

    <!-- Soft drop shadow for icon depth -->
    <filter id="drop-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#4C0519" flood-opacity="0.28" />
    </filter>
  </defs>

  <g filter="url(#drop-shadow)">
    <!-- Base Spherical Ball -->
    <circle cx="96" cy="84" r="58" fill="url(#yarn-base)" />

    <!-- Deep Shadow Yarn Strands (Underneath) -->
    <path d="M 46,62 C 68,104 124,104 146,62" fill="none" stroke="#9F1239" stroke-width="11" stroke-linecap="round" />
    <path d="M 146,106 C 124,64 68,64 46,106" fill="none" stroke="#BE123C" stroke-width="11" stroke-linecap="round" />

    <!-- Main Midtone Yarn Strands -->
    <path d="M 40,84 C 68,124 124,124 152,84" fill="none" stroke="#FB7185" stroke-width="11" stroke-linecap="round" />
    <path d="M 58,42 C 102,74 102,126 58,126" fill="none" stroke="#FB7185" stroke-width="11" stroke-linecap="round" />
    <path d="M 134,42 C 90,74 90,126 134,126" fill="none" stroke="#F43F5E" stroke-width="11" stroke-linecap="round" />

    <!-- Highlight Yarn Strands (Top Layer) -->
    <path d="M 64,34 C 104,56 136,80 148,100" fill="none" stroke="#FFE4E6" stroke-width="8" stroke-linecap="round" opacity="0.95" />
    <path d="M 44,72 C 76,96 116,96 148,72" fill="none" stroke="#FFE4E6" stroke-width="7" stroke-linecap="round" opacity="0.85" />
    <path d="M 82,28 C 112,58 112,110 86,138" fill="none" stroke="#FB7185" stroke-width="9" stroke-linecap="round" />

    <!-- Loose Trailing Strand -->
    <path d="M 86,138 C 70,160 42,148 28,162 C 18,172 26,182 40,180 C 60,177 82,182 98,174" fill="none" stroke="#F43F5E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Trailing Strand Highlight -->
    <path d="M 86,138 C 70,160 42,148 28,162 C 18,172 26,182 40,180 C 60,177 82,182 98,174" fill="none" stroke="#FFE4E6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  </g>
</svg>
